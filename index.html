<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>محكمة الصدق الأكاديمي • تجربة 3D</title>
<style>*{box-sizing:border-box}body{margin:0;background:#10171b;color:#f6ebd4;font-family:Tahoma,Arial,sans-serif;overflow:hidden}canvas{display:block}#hud{position:fixed;top:16px;right:16px;z-index:10;width:min(365px,calc(100vw - 32px));background:#17232bee;border:1px solid #9f8a5f70;border-radius:16px;padding:16px;box-shadow:0 15px 50px #0008;backdrop-filter:blur(10px)}h1{font-size:19px;color:#e6c88b;margin:0 0 8px}p{font-size:12px;line-height:1.8;margin:3px 0}#hint{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);border:1px solid #b99964;background:#101b20ea;padding:10px 18px;border-radius:24px;font-size:12px;text-align:center;white-space:nowrap;z-index:4}button{font:inherit;cursor:pointer;background:#ae8652;color:white;border:0;border-radius:10px;padding:10px 14px}#menu{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}#menu button{font-size:11px;background:#324c51}#case{position:fixed;inset:0;background:#080e11d9;z-index:30;display:none;align-items:center;justify-content:center;padding:18px}#panel{width:min(530px,100%);background:#f9f3e6;color:#263238;border:6px double #b39a65;border-radius:17px;padding:24px;box-shadow:0 25px 90px #000a}#panel h2{font-size:24px;color:#6d5129}#panel p{font-size:16px}#panel button{margin:5px}#answer{background:#e5ebde;padding:13px;border-radius:10px;display:none;line-height:1.8}#joystick{display:none;position:fixed;bottom:70px;right:16px;z-index:20;grid-template-columns:55px 55px 55px;gap:4px}#joystick button{background:#233e47db;padding:14px}#joyTop{grid-column:2}#joyLeft{grid-column:1}#joyDown{grid-column:2}#joyRight{grid-column:3}@media(max-width:750px){#joystick{display:grid}#hud{padding:12px}#hint{bottom:10px;font-size:10px;max-width:90%;white-space:normal}h1{font-size:16px}}</style>
</head><body><div id="hud"><h1>⚖ محكمة الصدق الأكاديمي</h1><p>تجربة أولية ثلاثية الأبعاد مبنية على مواقف من سياسة الصدق الأكاديمي. انتقل إلى الملفات المضيئة وافتح الأدلة.</p><div id="menu"><button id="open1">قضية التوثيق</button><button id="open2">قضية التشابه</button><button id="reset">العودة للمدخل</button></div><p id="status">استخدم الأسهم للحركة و A / D للدوران أو اسحب المشهد بالفأرة.</p></div><div id="hint">انقر على الأدلة المضيئة أو استخدم أزرار الهاتف</div><div id="joystick"><button id="joyTop">▲</button><button id="joyLeft">◀</button><button id="joyDown">▼</button><button id="joyRight">▶</button></div><div id="case"><div id="panel"><h2 id="caseTitle"></h2><p id="caseText"></p><div id="choices"></div><div id="answer"></div><button id="close">إغلاق الملف</button></div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x111a20);scene.fog=new THREE.Fog(0x111a20,35,75);
const camera=new THREE.PerspectiveCamera(67,innerWidth/innerHeight,.1,110);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'low-power'});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.body.prepend(renderer.domElement);
const mat=(c,r=.65,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const oak=mat(0x523322,.48),oak2=mat(0x8c5c3b,.43),gold=mat(0xc9a467,.3,.65),ivory=mat(0xede2d1),wall=mat(0xb6a58e),marble=mat(0x8f9793,.3),chair=mat(0x34403e);
const interactive=[];
function cube(x,y,z,w,h,d,ma,interactiveId){let a=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),ma);a.position.set(x,y,z);a.castShadow=true;a.receiveShadow=true;scene.add(a);if(interactiveId){a.userData.id=interactiveId;interactive.push(a)}return a}
function cyl(x,y,z,r,h,ma,segments=16){let a=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,segments),ma);a.position.set(x,y,z);a.castShadow=true;scene.add(a);return a}
function glow(x,y,z,c=0xffd39a,p=8){let a=new THREE.PointLight(c,p,11);a.position.set(x,y,z);scene.add(a)}
scene.add(new THREE.HemisphereLight(0xe6f4ff,0x59412b,2));
let sun=new THREE.DirectionalLight(0xffe0a1,3);sun.position.set(-7,11,6);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);scene.add(sun);
cube(0,-.22,-6,22,.4,31,marble);cube(0,5.7,-6,22,.45,31,ivory);cube(-11,2.7,-6,.35,6,31,wall);cube(11,2.7,-6,.35,6,31,wall);cube(0,2.7,-21.5,22,6,.35,wall);cube(0,2.7,9.5,22,6,.35,wall);
for(let x of [-10.6,10.6])for(let z=-19;z<9;z+=4){cube(x,3,z,.22,5,.35,ivory);cube(x,5.15,z,.28,.22,3.5,gold)}for(let z=-19;z<9;z+=3)for(let x of [-9,9]){cube(x,.05,z,.15,.15,2.8,gold)}
for(let x of [-8.5,8.5])for(let z of [-18,-12,-6,0,6]){cube(x,2.9,z,.22,4.9,.2,oak2);cube(x,4.9,z,.5,.18,2.5,gold)}
for(let z of [-11,-3,5]){cube(0,5.4,z,9,.13,.2,gold);for(let x of [-7,7])cube(x,5.4,z,.2,.13,26,gold)}
cube(0,.3,-18,11,.6,4,oak);cube(0,1.2,-19.4,8,1.8,1.3,oak2);cube(0,2.0,-20.1,10,.18,2,oak);cube(0,2.9,-20.6,7,1.7,.35,oak);cube(0,3.7,-20.36,3.1,.18,.15,gold);cube(0,3.4,-20.33,.08,.9,.16,gold);cube(0,2.8,-20.3,1.1,.08,.17,gold);
for(let x of [-7,7]){cube(x,1,-13,3.2,1.6,2,oak2);cube(x,1.83,-13,3.4,.17,2.2,gold);cube(x,1.5,-14.1,3,.3,.22,oak)}
for(let z of [-8,-5,-2,1,4])for(let x of [-8,-5,5,8]){cube(x,.9,z,2,.35,.95,oak2);cube(x,1.6,z-.38,2,1.25,.2,oak);cube(x,.42,z,1.5,.22,.7,chair)}
for(let z of [-13,-4,5]){cyl(0,4.95,z,.38,.14,gold);for(let i=0;i<8;i++){let a=i*Math.PI/4;let x=Math.cos(a)*1.45,zz=Math.sin(a)*1.45;cyl(x,4.2,z+zz,.05,1.2,gold,10);glow(x,3.6,z+zz,0xffd8a2,1.9)}}
for(let x of [-7,7])for(let z of [-18,-7,4])glow(x,3.7,z,0xffc790,3.5);
const frame=mat(0xc4a46d,.3,.4);for(let x of [-4.5,4.5]){cube(x,2.5,9.14,3.5,4.7,.15,oak2);cube(x,4.7,9.03,3.75,.18,.2,frame)}
const tabletMat=new THREE.MeshStandardMaterial({color:0x6dc4b4,emissive:0x1d8f86,emissiveIntensity:1.5,roughness:.3});cube(-6,2,-12,1.6,.95,.14,tabletMat,1);cube(6,2,-12,1.6,.95,.14,tabletMat,2);
let angle=0,pos=new THREE.Vector3(0,1.65,6),keys={},drag=false,lastX=0;
function reset(){pos.set(0,1.65,6);angle=0}document.getElementById('reset').onclick=reset;
const data={1:{t:'ملف 01 — الاقتباس والتوثيق',q:'أعاد معلم طالب صياغة أفكار من مرجع تربوي بكلماته، لكنه لم يوثق المصدر. ما القرار الأدق؟',choices:['العمل سليم لأن الكلمات أصبحت كلماته','يجب توثيق مصدر الفكرة حتى بعد إعادة الصياغة'],correct:1,ex:'تؤكد سياسة الصدق الأكاديمي أن الأفكار والحجج المأخوذة من الآخرين تتطلب الاعتراف بالمصدر حتى عند إعادة صياغتها بكلمات المعلم الطالب.'},2:{t:'ملف 02 — نسبة التشابه',q:'أظهرت أداة الفحص نسبة تشابه 2%. هل تثبت النسبة وحدها أصالة المهمة؟',choices:['نعم؛ انخفاض النسبة يعني سلامة المهمة','لا؛ تحتاج المهمة إلى مراجعة بشرية ومناقشة الأصالة'],correct:1,ex:'الملخص المرفق للسياسة يضع نسبة 2% أو أقل تحت المراجعة البشرية. التشابه الرقمي لا يثبت وحده الأصالة ولا المخالفة.'}};
function show(id){const d=data[id];document.getElementById('caseTitle').textContent=d.t;document.getElementById('caseText').textContent=d.q;const ch=document.getElementById('choices');ch.innerHTML='';const ans=document.getElementById('answer');ans.style.display='none';d.choices.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c;b.style.background='#41585c';b.onclick=()=>{ans.style.display='block';ans.textContent=(i===d.correct?'✓ قرار سليم. ':'↻ راجع القرار. ')+d.ex};ch.appendChild(b)});document.getElementById('case').style.display='flex'}
document.getElementById('open1').onclick=()=>show(1);document.getElementById('open2').onclick=()=>show(2);document.getElementById('close').onclick=()=>document.getElementById('case').style.display='none';
const ray=new THREE.Raycaster(),mouse=new THREE.Vector2();renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX});renderer.domElement.addEventListener('pointerup',e=>{if(Math.abs(e.clientX-lastX)>8)return;mouse.x=e.clientX/innerWidth*2-1;mouse.y=-(e.clientY/innerHeight*2-1);ray.setFromCamera(mouse,camera);let hits=ray.intersectObjects(interactive);if(hits.length)show(hits[0].object.userData.id)});renderer.domElement.addEventListener('pointermove',e=>{if(drag){angle-=(e.clientX-lastX)*.004;lastX=e.clientX}});addEventListener('pointerup',()=>drag=false);
addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true);addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
const touch={joyTop:'arrowup',joyDown:'arrowdown',joyLeft:'a',joyRight:'d'};Object.entries(touch).forEach(([id,k])=>{const b=document.getElementById(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});for(const ev of ['pointerup','pointercancel','pointerleave'])b.addEventListener(ev,()=>keys[k]=false)});
let prev=performance.now();function tick(now){requestAnimationFrame(tick);let dt=Math.min((now-prev)/1000,.05);prev=now;const turn=(keys.a||keys.arrowleft?1:0)-(keys.d||keys.arrowright?1:0);angle+=turn*dt*1.4;let speed=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0);pos.x-=Math.sin(angle)*speed*dt*3;pos.z-=Math.cos(angle)*speed*dt*3;pos.x=Math.max(-9.4,Math.min(9.4,pos.x));pos.z=Math.max(-17,Math.min(7.5,pos.z));camera.position.copy(pos);camera.rotation.set(0,angle,0);renderer.render(scene,camera)}tick(performance.now());
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
